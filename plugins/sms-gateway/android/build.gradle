apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'

android {
    namespace "cloud.einsatzleiter.smsgatewayplugin"
    compileSdk (rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36)

    buildFeatures {
        viewBinding true
    }

    defaultConfig {
        minSdk (rootProject.ext.has('minSdkVersion') ? rootProject.ext.minSdkVersion : 24)
        targetSdk (rootProject.ext.has('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35)
        versionCode 1
        versionName "1.0"
    }

    // CI generates an overlay under build/; the versioned default stays false.
    if (project.findProperty('autoUpdate') == 'true') {
        sourceSets.debug.res.srcDir layout.buildDirectory.dir('generated/auto-update-res')
        sourceSets.release.res.srcDir layout.buildDirectory.dir('generated/auto-update-res')
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    def roomVersion = '2.8.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    implementation project(':capacitor-android')
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core-ktx:1.18.0'
    // EinsatzLivePlugin greift ueber activity (Plugin-Basisklasse, Typ AppCompatActivity)
    // auf activity?.intent zu - ohne eigene Abhaengigkeit ist der Typ hier nicht auflösbar,
    // auch wenn capacitor-android appcompat transitiv mitbringt (nur implementation-scoped).
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
    implementation 'androidx.work:work-runtime-ktx:2.12.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation "androidx.room:room-runtime:$roomVersion"
    // Kept explicitly; Room 2.7+ includes the KTX APIs in room-runtime.
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
}
