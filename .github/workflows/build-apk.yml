name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_FILE != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Capacitor 8 benötigt weiterhin JDK 21.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Android synchronisieren und Firebase konfigurieren
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash scripts/prepare-android.sh

      - name: Patch Version in build.gradle
        run: |
          # Bei Tag-Builds (v*) kommt die versionName direkt aus dem Git-Tag,
          # damit APK-Version und GitHub-Release immer übereinstimmen (sonst
          # muss package.json bei jedem Tag manuell nachgezogen werden, was
          # den In-App-Update-Check dauerhaft "Update verfügbar" melden lässt).
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          VERSION_CODE=${{ github.run_number }}
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "'"$VERSION"'"/' android/app/build.gradle
          echo "versionName=$VERSION, versionCode=$VERSION_CODE"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Generate app icons from Logo-rot.png
        run: |
          cp assets/Logo-rot.png assets/icon.png
          cp assets/Logo-rot.png assets/icon-foreground.png
          npx capacitor-assets generate --android

      - name: Unit-Tests (Plugins und Startseite)
        working-directory: android
        run: |
          ./gradlew :einsatzleiter-sms-gateway-plugin:testDebugUnitTest :native-files:testDebugUnitTest
          node ../scripts/offline-page.test.mjs

      - name: Build Standard-APK
        working-directory: android
        run: |
          # Baut in ci-artifacts/ ausserhalb von app/build/outputs: Gradles
          # PackageApplication-Task synct diesen Ordner bei jedem assemble*-Lauf
          # (inkl. des zweiten Durchlaufs fuer die Auto-Update-Variante unten) und
          # entfernt dabei nicht selbst erzeugte Dateien - eine Kopie dort wuerde
          # beim zweiten Durchlauf wieder verschwinden.
          mkdir -p ci-artifacts
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "Release-Build"
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release-unsigned.apk ci-artifacts/app-release-standard-unsigned.apk
          else
            echo "Kein Keystore-Secret - Debug-APK (sideloadbar)"
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ci-artifacts/app-debug-standard.apk
          fi

      - name: Build Auto-Update-APK
        working-directory: android
        run: |
          # Restore tracked app metadata on success and failure. The resource overlay
          # itself lives under the ignored plugin build/ directory.
          BACKUP_DIR=$(mktemp -d)
          cp app/src/main/AndroidManifest.xml "$BACKUP_DIR/AndroidManifest.xml"
          cp app/src/main/res/values/strings.xml "$BACKUP_DIR/strings.xml"
          restore_metadata() {
            cp "$BACKUP_DIR/AndroidManifest.xml" app/src/main/AndroidManifest.xml
            cp "$BACKUP_DIR/strings.xml" app/src/main/res/values/strings.xml
            rm -rf "$BACKUP_DIR"
          }
          trap restore_metadata EXIT
          python3 - <<'EOF'
          import re

          from pathlib import Path

          resource_path = Path("../plugins/sms-gateway/android/build/generated/auto-update-res/values/auto_update.xml")
          resource_path.parent.mkdir(parents=True, exist_ok=True)
          resource_path.write_text(
              '<resources><bool name="auto_update_enabled">true</bool></resources>\n',
              encoding="utf-8",
          )

          manifest_path = "app/src/main/AndroidManifest.xml"
          with open(manifest_path, encoding="utf-8") as f:
              manifest = f.read()
          PERMISSIONS = ["android.permission.REQUEST_INSTALL_PACKAGES"]
          for perm in PERMISSIONS:
              if perm not in manifest:
                  manifest = manifest.replace(
                      "</manifest>",
                      f'    <uses-permission android:name="{perm}" />\n</manifest>',
                  )
          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(manifest)

          strings_path = "app/src/main/res/values/strings.xml"
          with open(strings_path, encoding="utf-8") as f:
              strings = f.read()
          strings, changed = re.subn(
              r'(<string name="app_name">)(.*?)(</string>)',
              lambda match: match.group(1) + match.group(2).replace(" (Auto-Update)", "") + " (Auto-Update)" + match.group(3),
              strings,
              count=1,
          )
          if changed != 1:
              raise SystemExit("App-Label in strings.xml nicht gefunden")
          with open(strings_path, "w", encoding="utf-8") as f:
              f.write(strings)
          EOF
          mkdir -p ci-artifacts
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "Release-Build (Auto-Update)"
            ./gradlew assembleRelease -PautoUpdate=true
            cp app/build/outputs/apk/release/app-release-unsigned.apk ci-artifacts/app-release-autoupdate-unsigned.apk
          else
            echo "Kein Keystore-Secret - Debug-APK (Auto-Update)"
            ./gradlew assembleDebug -PautoUpdate=true
            cp app/build/outputs/apk/debug/app-debug.apk ci-artifacts/app-debug-autoupdate.apk
          fi

      - name: Nur ein FCM-Empfaenger im Manifest
        working-directory: android
        run: |
          # Zwei MESSAGING_EVENT-Services -> Firebase stellt nur an den ersten zu;
          # dann erreichen nativer Alarm und Zustellbestaetigung die App nie.
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for apk in ci-artifacts/*.apk; do
            if "$AAPT2" dump xmltree --file AndroidManifest.xml "$apk" | grep -q "com.capacitorjs.plugins.pushnotifications.MessagingService"; then
              echo "::error::$apk enthaelt Capacitors MessagingService - FCM-Nachrichten erreichen EinsatzFirebaseMessagingService nicht"
              exit 1
            fi
          done

      - name: Sign Release APKs
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > /tmp/ks-orig.p12
          chmod 600 /tmp/ks-orig.p12
          # openssl re-packaged PKCS12 mit modernen Algorithmen (Java 21-kompatibel)
          openssl pkcs12 -in /tmp/ks-orig.p12 -nocerts -nodes \
            -passin env:KEYSTORE_PASSWORD -out /tmp/key.pem \
            -provider default -provider legacy 2>/dev/null || \
          openssl pkcs12 -in /tmp/ks-orig.p12 -nocerts -nodes \
            -passin env:KEYSTORE_PASSWORD -out /tmp/key.pem
          openssl pkcs12 -in /tmp/ks-orig.p12 -nokeys \
            -passin env:KEYSTORE_PASSWORD -out /tmp/cert.pem \
            -provider default -provider legacy 2>/dev/null || \
          openssl pkcs12 -in /tmp/ks-orig.p12 -nokeys \
            -passin env:KEYSTORE_PASSWORD -out /tmp/cert.pem
          openssl pkcs12 -export \
            -in /tmp/cert.pem -inkey /tmp/key.pem \
            -name "$KEY_ALIAS" \
            -out /tmp/keystore.jks \
            -passout env:KEYSTORE_PASSWORD
          chmod 600 /tmp/keystore.jks
          rm -f /tmp/ks-orig.p12 /tmp/key.pem /tmp/cert.pem
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name "apksigner" | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks /tmp/keystore.jks \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out android/ci-artifacts/app-release-standard-signed.apk \
            android/ci-artifacts/app-release-standard-unsigned.apk
          "$APKSIGNER" sign \
            --ks /tmp/keystore.jks \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out android/ci-artifacts/app-release-autoupdate-signed.apk \
            android/ci-artifacts/app-release-autoupdate-unsigned.apk
          rm -f /tmp/keystore.jks

      - name: APK-Dateien mit Versionsnummer benennen
        run: |
          # Damit sowohl der Workflow-Artifact als auch der GitHub-Release-Anhang
          # die Versionsnummer im Dateinamen tragen (z.B. beim direkten Download
          # von der Releases-Seite erkennbar, ohne die Release-Beschreibung zu lesen).
          cd android/ci-artifacts
          if [ -f app-release-standard-signed.apk ]; then
            cp app-release-standard-signed.apk "einsatzcockpit-v${APP_VERSION}.apk"
          fi
          if [ -f app-release-standard-unsigned.apk ]; then
            cp app-release-standard-unsigned.apk "einsatzcockpit-v${APP_VERSION}-unsigned.apk"
          fi
          if [ -f app-release-autoupdate-signed.apk ]; then
            cp app-release-autoupdate-signed.apk "einsatzcockpit-autoupdate-v${APP_VERSION}.apk"
          fi
          if [ -f app-release-autoupdate-unsigned.apk ]; then
            cp app-release-autoupdate-unsigned.apk "einsatzcockpit-autoupdate-v${APP_VERSION}-unsigned.apk"
          fi
          if [ -f app-debug-standard.apk ]; then
            cp app-debug-standard.apk "einsatzcockpit-v${APP_VERSION}-debug.apk"
          fi
          if [ -f app-debug-autoupdate.apk ]; then
            cp app-debug-autoupdate.apk "einsatzcockpit-autoupdate-v${APP_VERSION}-debug.apk"
          fi

      - name: Upload Standard-APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: einsatzcockpit-v${{ env.APP_VERSION }}
          path: |
            android/ci-artifacts/einsatzcockpit-v${{ env.APP_VERSION }}.apk
            android/ci-artifacts/einsatzcockpit-v${{ env.APP_VERSION }}-unsigned.apk
            android/ci-artifacts/einsatzcockpit-v${{ env.APP_VERSION }}-debug.apk

      - name: Upload Auto-Update-APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: einsatzcockpit-autoupdate-v${{ env.APP_VERSION }}
          path: |
            android/ci-artifacts/einsatzcockpit-autoupdate-v${{ env.APP_VERSION }}.apk
            android/ci-artifacts/einsatzcockpit-autoupdate-v${{ env.APP_VERSION }}-unsigned.apk
            android/ci-artifacts/einsatzcockpit-autoupdate-v${{ env.APP_VERSION }}-debug.apk

      - name: Create GitHub Release (nur auf Tags mit Keystore)
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.HAS_KEYSTORE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/ci-artifacts/einsatzcockpit-v${{ env.APP_VERSION }}.apk
            android/ci-artifacts/einsatzcockpit-autoupdate-v${{ env.APP_VERSION }}.apk
          name: Einsatzcockpit Android ${{ github.ref_name }}
          body: |
            ## Einsatzcockpit Android ${{ github.ref_name }} (Build ${{ github.run_number }})

            Native Android-App für [einsatzcockpit.com](https://einsatzcockpit.com) —
            Einheit-Gerät (WebView-Wrapper) und SMS-Gateway-Modus.

            ## Installation
            1. APK-Datei auf das Android-Gerät übertragen
            2. Einstellungen → Sicherheit → „Unbekannte Quellen" erlauben
            3. APK installieren
            4. App starten → QR-Code aus dem Admin-Bereich scannen
               (Admin → Geräte-Login → Einheit-Gerät oder SMS-Gateway registrieren)

            ## SMS-Gateway: Nach der Installation
            Beim ersten Start im Gateway-Modus erscheint ein Hinweis zur
            **Akku-Optimierung**. Bitte deaktivieren, damit die Verbindung
            dauerhaft bestehen bleibt und keine SMS verloren gehen.

      - name: Version auf main bumpen (nach Release)
        # Läuft nur bei Tag-Builds mit Keystore, direkt im Anschluss an die
        # Release-Erstellung oben. Grund für den Inline-Schritt statt des
        # separaten version-bump.yml-Workflows: Ein per GITHUB_TOKEN erstelltes
        # Release löst laut GitHub keine Folge-Workflows aus ("release:
        # published" feuert dort nicht) - version-bump.yml blieb dadurch nach
        # jedem CI-Release wirkungslos stehen. version-bump.yml bleibt als
        # Fallback für manuell (im Browser) veröffentlichte Releases bestehen,
        # dort greift die GITHUB_TOKEN-Einschränkung nicht.
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.HAS_KEYSTORE == 'true' }}
        run: |
          python3 - <<'EOF'
          import datetime
          import json
          import sys

          with open("package.json", encoding="utf-8") as f:
              package = json.load(f)
          old_ver = package.get("version", "")
          today = datetime.date.today().strftime("%Y.%m.%d")
          if old_ver == today:
              new_ver = f"{today}.1"
          elif old_ver.startswith(f"{today}."):
              suffix = old_ver.removeprefix(f"{today}.")
              if not suffix.isdigit():
                  sys.exit(f"Ungueltiger CalVer-Suffix: {old_ver}")
              new_ver = f"{today}.{int(suffix) + 1}"
          else:
              new_ver = today
          print(f"Bump: {old_ver} -> {new_ver}")

          for path in ("package.json", "package-lock.json"):
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
              data["version"] = new_ver
              if path == "package-lock.json":
                  data["packages"][""]["version"] = new_ver
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
                  f.write("\n")
          EOF
          V=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: Version auf ${V} aktualisieren (nach Release)"
          git push origin HEAD:main
